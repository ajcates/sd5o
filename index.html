
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>SD Sheriff Calls For Service</title>
  <meta name="description" content="Calls for service for the San Diego Sheriff's Department">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32x32.png">
  <style>
    :root {
      color-scheme: dark;
      --primary: #4d9dff;
      --on-primary: #001a3a;
      --primary-container: #0f2c4d;
      --on-primary-container: #bfdcff;
      --secondary: #ff4d4d;
      --on-secondary-container: #ffd4d4;
      --secondary-container: #4a1414;
      --surface: #000000;
      --surface-container: #0a0a0d;
      --surface-container-high: #121218;
      --surface-container-highest: #1a1a22;
      --on-surface: #eaeaf0;
      --on-surface-variant: #9a9aa8;
      --outline: #5a5a68;
      --outline-variant: #26262f;
      --error: #ff6b6b;
      --error-container: #4a1414;
      --shadow: rgba(0, 0, 0, 0.6);
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      --ease-emphasized: cubic-bezier(0.2, 0, 0, 1.2);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--surface);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--on-surface);
      background:
        radial-gradient(circle at 8% -12%, rgba(77, 157, 255, 0.10), transparent 30rem),
        radial-gradient(circle at 96% 0%, rgba(255, 77, 77, 0.07), transparent 28rem),
        var(--surface);
      font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 0.875rem;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a,
    input {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    .app-shell {
      width: min(100%, 1400px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 20px 32px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -20px;
      background: rgba(0, 0, 0, 0.9);
      border-bottom: 1px solid var(--outline-variant);
      backdrop-filter: blur(18px) saturate(135%);
      animation: app-bar-enter 360ms var(--ease-standard) both;
    }

    .top-app-bar {
      display: grid;
      grid-template-columns: minmax(220px, auto) auto;
      grid-template-areas: "brand actions";
      align-items: center;
      gap: 20px;
      min-height: 64px;
      padding: max(8px, env(safe-area-inset-top)) 20px 8px;
    }

    .search-bar {
      display: flex;
      align-items: center;
      height: 0;
      overflow: hidden;
      padding: 0 20px;
      transition: height 220ms var(--ease-emphasized);
    }

    .search-bar.open {
      height: 60px;
    }

    .search-bar .search-field {
      width: 100%;
    }

    .map-panel {
      position: sticky;
      /* Synced to .app-header's real rendered height by main.js's
         ResizeObserver -- the search bar's open/closed state changes that
         height, so a hardcoded offset would gap or overlap depending on
         search state. The fallback covers the one frame before JS runs. */
      top: var(--header-height, 65px);
      z-index: 5;
      height: 0;
      overflow: hidden;
      margin: 0;
      background: var(--surface);
      border-radius: 14px;
      transition: height 320ms var(--ease-emphasized);
    }

    .map-panel.open {
      height: 360px;
      margin: 14px 0 0;
      box-shadow: 0 18px 48px var(--shadow);
    }

    #map-canvas {
      width: 100%;
      height: 360px;
      background: var(--surface-container);
    }

    .leaflet-container {
      background: var(--surface-container) !important;
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      font-family: inherit;
    }

    /* OSM's default tiles are a bright cream/white basemap -- jarring
       against this app's all-black surface. Standard dark-mode-map trick:
       invert then hue-rotate back to restore natural-looking blues/greens
       instead of inversion's orange sky/land. Applied to the tile pane
       only, not markers/popups/controls, which already have their own
       dark styling below and would invert into the wrong colors. */
    .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.92) saturate(0.9);
    }

    .leaflet-control-attribution,
    .leaflet-bar a {
      color: var(--on-surface-variant) !important;
      background: var(--surface-container-high) !important;
      border-color: var(--outline-variant) !important;
    }

    .leaflet-control-attribution a {
      color: var(--primary) !important;
    }

    .leaflet-bar a:hover {
      background: var(--surface-container-highest) !important;
    }

    .call-marker {
      position: relative;
      display: block;
      width: 12px;
      height: 12px;
      background: var(--marker-color, var(--primary));
      border: 2px solid var(--surface);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    /* Fill color is the call's dispatch category (event-category.js);
       this ring is the only remaining open/closed signal on the map
       now that the fill no longer carries it. */
    .call-marker.open {
      border-color: var(--secondary);
    }

    /* The selected call keeps its category fill and open/closed ring;
       this tiny center point adds selection without replacing either. */
    .call-marker.selected::before {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 3px;
      background: #80b9ff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.9);
      content: "";
      transform: translate(-50%, -50%);
    }

    .call-marker.pulsing::after {
      position: absolute;
      inset: 0;
      border: 1.5px solid var(--marker-color, var(--primary));
      border-radius: 50%;
      content: "";
      opacity: var(--pulse-opacity, 0.5);
      animation: call-marker-pulse var(--pulse-duration, 2s) var(--ease-standard) infinite;
    }

    @keyframes call-marker-pulse {
      0% {
        opacity: var(--pulse-opacity, 0.5);
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(var(--pulse-scale, 2));
      }
    }

    /* A hollow ring rather than a filled dot -- reads clearly as "you are
       here" without being mistaken for a call marker (those are always
       filled, see .call-marker above). */
    .user-location-marker {
      position: relative;
      display: block;
      width: 16px;
      height: 16px;
      background: transparent;
      border: 3px solid #4d9dff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.5), 0 0 10px rgba(77, 157, 255, 0.65);
    }

    .user-location-marker::after {
      position: absolute;
      inset: -7px;
      border: 1.5px solid #4d9dff;
      border-radius: 50%;
      content: "";
      opacity: 0.55;
      animation: user-location-pulse 2.2s var(--ease-standard) infinite;
    }

    @keyframes user-location-pulse {
      0% {
        opacity: 0.55;
        transform: scale(0.85);
      }
      100% {
        opacity: 0;
        transform: scale(1.6);
      }
    }

    tbody tr.selected td {
      background: rgba(77, 157, 255, 0.18);
      transition: background 200ms var(--ease-standard);
    }

    .brand {
      grid-area: brand;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--on-primary-container);
      background: linear-gradient(145deg, #1a4a80, var(--primary-container));
      border: 1px solid rgba(77, 157, 255, 0.28);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 20, 45, 0.4);
    }

    .brand-mark svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      display: block;
      margin-bottom: 1px;
      color: var(--on-surface-variant);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    h1 {
      overflow: hidden;
      margin: 0;
      font-size: clamp(1.02rem, 1.6vw, 1.2rem);
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-field {
      position: relative;
      display: flex;
      align-items: center;
      height: 40px;
      color: var(--on-surface-variant);
      background: var(--surface-container-high);
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      transition: background 160ms var(--ease-standard), border-color 160ms var(--ease-standard), box-shadow 160ms var(--ease-standard);
    }

    .search-field:focus-within {
      color: var(--primary);
      background: var(--surface-container-highest);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(77, 157, 255, 0.14);
    }

    .search-field svg {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin-left: 13px;
      fill: currentColor;
      pointer-events: none;
    }

    #filter {
      width: 100%;
      height: 100%;
      min-width: 0;
      padding: 0 16px 0 12px;
      color: var(--on-surface);
      background: transparent;
      border: 0;
      outline: 0;
    }

    #filter::placeholder {
      color: var(--on-surface-variant);
      opacity: 0.84;
    }

    #buttons {
      grid-area: actions;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .icon-button {
      position: relative;
      display: grid;
      width: 40px;
      height: 40px;
      padding: 0;
      place-items: center;
      color: var(--on-primary-container);
      background: var(--primary-container);
      border: 1px solid rgba(77, 157, 255, 0.22);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 20, 45, 0.35);
      cursor: pointer;
      overflow: hidden;
      transition: transform 140ms var(--ease-standard), background 140ms var(--ease-standard), box-shadow 140ms var(--ease-standard);
    }

    .icon-button::before {
      position: absolute;
      inset: 0;
      background: currentColor;
      content: "";
      opacity: 0;
      transition: opacity 140ms var(--ease-standard);
    }

    .icon-button:hover {
      box-shadow: 0 9px 24px rgba(0, 34, 70, 0.38);
      transform: translateY(-1px);
    }

    .icon-button:hover::before {
      opacity: 0.08;
    }

    .icon-button:active {
      transform: scale(0.94);
    }

    .icon-button:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .icon-button:disabled {
      cursor: wait;
      opacity: 0.78;
    }

    .icon-button svg {
      position: relative;
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .icon-button:disabled svg {
      animation: spin 720ms linear infinite;
    }

    .status-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      margin: 14px 0 10px;
      padding: 10px 16px;
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      box-shadow: 0 14px 40px var(--shadow);
      animation: surface-enter 380ms 60ms var(--ease-standard) both;
    }

    .feed-summary {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 5px 7px;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
      transition: background 140ms var(--ease-standard);
    }

    .feed-summary:hover {
      background: var(--surface-container-high);
    }

    .feed-summary:disabled {
      cursor: wait;
      opacity: 0.9;
    }

    .feed-summary:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .status-dot {
      position: relative;
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      background: var(--secondary);
      border: 2px solid rgba(255, 77, 77, 0.3);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(255, 77, 77, 0.1);
    }

    .status-panel.loading .status-dot::after {
      position: absolute;
      inset: -6px;
      border: 1px solid var(--secondary);
      border-radius: inherit;
      content: "";
      animation: status-pulse 1.25s var(--ease-standard) infinite;
    }

    .status-panel.error .status-dot {
      background: var(--error);
      border-color: rgba(255, 107, 107, 0.3);
      box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
    }

    .update-line {
      margin: 0;
      color: var(--on-surface);
      font-size: 0.85rem;
    }

    #update {
      font-weight: 650;
    }

    .status-meta {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    #calls-status,
    #event-count {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      padding: 3px 10px;
      color: var(--on-primary-container);
      background: rgba(15, 44, 77, 0.85);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.015em;
      white-space: nowrap;
    }

    #event-count {
      color: var(--on-surface-variant);
      background: var(--surface-container-highest);
    }

    .status-panel.error #calls-status {
      color: var(--error);
      background: var(--error-container);
    }

    #listing {
      min-height: 220px;
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      box-shadow: 0 18px 48px var(--shadow);
      overflow: hidden;
      animation: surface-enter 420ms 110ms var(--ease-standard) both;
    }

    .loading-state,
    .error-state {
      display: grid;
      min-height: 240px;
      padding: 32px;
      place-items: center;
      color: var(--on-surface-variant);
      text-align: center;
    }

    .loading-content {
      width: min(100%, 360px);
    }

    .loading-content p {
      margin: 0 0 20px;
      font-weight: 550;
    }

    .loading-bar {
      height: 10px;
      margin-top: 10px;
      background: linear-gradient(90deg, var(--surface-container-high) 25%, var(--surface-container-highest) 45%, var(--surface-container-high) 65%);
      background-size: 250% 100%;
      border-radius: 999px;
      animation: shimmer 1.1s linear infinite;
    }

    .loading-bar:nth-child(2) {
      width: 78%;
    }

    .loading-bar:nth-child(3) {
      width: 92%;
    }

    .loading-bar:nth-child(4) {
      width: 64%;
    }

    .error-state strong {
      display: block;
      margin-bottom: 6px;
      color: var(--error);
      font-size: 1.05rem;
    }

    .distance-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 14px;
      background: var(--surface-container-high);
      border-bottom: 1px solid var(--outline-variant);
    }

    .distance-explanation {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .distance-explanation strong {
      font-size: 0.8rem;
      font-weight: 700;
    }

    .distance-explanation span {
      color: var(--on-surface-variant);
      font-size: 0.7rem;
    }

    .distance-controls.unavailable .distance-explanation span,
    .distance-controls.error .distance-explanation span {
      color: var(--error);
    }

    .distance-actions,
    .sort-control {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
    }

    .sort-control {
      padding: 3px;
      background: var(--surface-container-highest);
      border: 1px solid var(--outline-variant);
      border-radius: 10px;
    }

    .sort-control > span {
      padding: 0 5px;
      color: var(--on-surface-variant);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .sort-control button,
    .text-button {
      min-height: 30px;
      padding: 5px 9px;
      color: var(--on-surface-variant);
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .sort-control button[aria-pressed="true"] {
      color: var(--on-primary-container);
      background: var(--primary-container);
    }

    .sort-control button:disabled,
    .text-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .sort-control button:focus-visible,
    .text-button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .text-button {
      color: var(--on-primary-container);
      background: var(--primary-container);
      border: 1px solid rgba(77, 157, 255, 0.22);
      white-space: nowrap;
    }

    .text-button.quiet {
      color: var(--on-surface-variant);
      background: transparent;
      border-color: var(--outline-variant);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    thead {
      background: var(--surface-container-high);
    }

    th,
    td {
      padding: 8px 14px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--on-surface-variant);
      background: var(--surface-container-high);
      border-bottom: 1px solid var(--outline-variant);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    th.Address,
    td.Address {
      width: 36%;
    }

    th.DateTime,
    td.DateTime {
      width: 18%;
    }

    th.Distance,
    td.Distance {
      width: 14%;
    }

    th.EventType,
    td.EventType {
      width: 32%;
    }

    tbody tr:not(.map) {
      cursor: pointer;
      animation: row-enter 280ms var(--ease-standard) both;
      animation-delay: min(calc(var(--row-index, 0) * 16ms), 220ms);
      transition: background 140ms var(--ease-standard), opacity 140ms var(--ease-standard);
    }

    tbody tr:not(.map):hover {
      background: rgba(77, 157, 255, 0.06);
    }

    tbody tr:not(.map):focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -3px;
    }

    td {
      color: var(--on-surface);
      border-bottom: 1px solid var(--outline-variant);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    /* Set per-row from event-category.js via the --category-color custom
       property (calls-list.js) -- matches the same call's marker fill
       color on the map, so a color means the same thing in both places. */
    tbody tr:not(.map) td:first-child {
      box-shadow: inset 3px 0 0 var(--category-color, transparent);
    }

    tbody tr:not(.open) {
      opacity: 0.58;
    }

    tbody tr:not(.open):hover {
      opacity: 0.8;
    }

    td.Address::before {
      display: inline-flex;
      margin: 0 7px 3px 0;
      padding: 1px 6px;
      color: var(--on-surface-variant);
      background: var(--surface-container-highest);
      border-radius: 999px;
      content: "Closed";
      font-size: 0.58rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      line-height: 1.5;
      text-transform: uppercase;
      vertical-align: middle;
    }

    tr.open td.Address::before {
      color: var(--on-secondary-container);
      background: var(--secondary-container);
      content: "Open";
    }

    .Address a {
      display: inline;
      color: var(--on-surface);
      font-weight: 600;
      line-height: 1.35;
      text-decoration: none;
    }

    .Address a:hover .address-primary {
      color: var(--primary);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .address-primary,
    .community {
      display: block;
    }

    .community {
      margin-top: 1px;
      color: var(--on-surface-variant);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.025em;
      text-transform: uppercase;
    }

    td.DateTime {
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
      font-size: 0.82rem;
    }

    td.Distance {
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .distance-chip {
      display: inline-flex;
      padding: 2px 7px;
      color: var(--on-primary-container);
      background: var(--primary-container);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .distance-unavailable {
      color: var(--outline);
    }

    td.EventType {
      color: var(--on-surface);
      font-weight: 520;
    }

    .badge-new,
    .badge-changed {
      display: inline-flex;
      margin: 0 7px 3px 0;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 0.58rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      line-height: 1.5;
      text-transform: uppercase;
      vertical-align: middle;
    }

    .badge-new {
      color: var(--on-primary-container);
      background: var(--primary-container);
    }

    .badge-changed {
      color: var(--on-secondary-container);
      background: var(--secondary-container);
    }

    .hidden {
      display: none !important;
    }

    @keyframes app-bar-enter {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes surface-enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes row-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes status-pulse {
      from { opacity: 0.65; transform: scale(0.55); }
      to { opacity: 0; transform: scale(1.35); }
    }

    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: -100% 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 760px) {
      .app-shell {
        padding: 0 10px 22px;
      }

      .app-header {
        margin: 0 -10px;
      }

      .top-app-bar {
        grid-template-columns: 1fr auto;
        gap: 10px;
        min-height: 56px;
        padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      }

      .search-bar {
        padding: 0 12px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 12px;
      }

      .search-field {
        height: 40px;
        border-radius: 12px;
      }

      .icon-button {
        width: 38px;
        height: 38px;
        border-radius: 12px;
      }

      .status-panel {
        align-items: flex-start;
        margin: 10px 0 8px;
        padding: 10px 12px;
        border-radius: 14px;
      }

      .status-meta {
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
      }

      #calls-status,
      #event-count {
        min-height: 24px;
        padding: 3px 8px;
        font-size: 0.66rem;
      }

      #listing {
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        overflow: visible;
      }

      .distance-controls {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 8px;
        padding: 12px;
        border: 1px solid var(--outline-variant);
        border-radius: 14px;
      }

      .distance-actions {
        justify-content: space-between;
        flex-wrap: wrap;
      }

      thead {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        clip: rect(0, 0, 0, 0);
        overflow: hidden;
      }

      table,
      tbody {
        display: block;
      }

      tbody {
        display: grid;
        gap: 7px;
      }

      tbody tr:not(.map) {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 12px;
        padding: 11px 13px;
        background: var(--surface-container);
        border: 1px solid var(--outline-variant);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      tbody tr:not(.map):hover {
        background: var(--surface-container-high);
      }

      tbody tr:not(.map) {
        border-left-width: 3px;
        border-left-color: var(--category-color, var(--outline-variant));
      }

      tbody tr:not(.open) {
        opacity: 0.68;
      }

      td,
      th.Address,
      td.Address,
      th.DateTime,
      td.DateTime,
      th.Distance,
      td.Distance,
      th.EventType,
      td.EventType {
        width: auto;
      }

      td {
        display: block;
        padding: 0;
        border: 0;
      }

      tbody tr:not(.map) td:first-child {
        box-shadow: none;
      }

      td.Address {
        grid-column: 1 / 2;
        grid-row: 1;
        min-width: 0;
      }

      td.Address::before {
        margin-bottom: 5px;
      }

      td.DateTime {
        grid-column: 2 / 3;
        grid-row: 1;
        align-self: start;
        padding-top: 2px;
        font-size: 0.72rem;
        text-align: right;
        white-space: nowrap;
      }

      td.Distance {
        grid-column: 2 / 3;
        grid-row: 2;
        align-self: center;
        text-align: right;
      }

      td.EventType {
        grid-column: 1 / 2;
        grid-row: 2;
        min-width: 0;
        padding-top: 8px;
        color: var(--primary);
        border-top: 1px solid var(--outline-variant);
        font-size: 0.82rem;
      }

      .distance-chip {
        font-size: 0.68rem;
      }

    }

    @media (max-width: 420px) {
      .status-panel {
        gap: 12px;
      }

      .update-line {
        font-size: 0.88rem;
      }

      #calls-status {
        display: none;
      }

      .distance-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .sort-control {
        justify-content: space-between;
      }

      .sort-control button {
        flex: 1 1 auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <div class="app-header">
      <header class="top-app-bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.56 3.57.56a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.19 2.45.56 3.57a1 1 0 0 1-.25 1.02l-2.19 2.2Z"/>
            </svg>
          </span>
          <div class="brand-copy">
            <span class="eyebrow">San Diego County</span>
            <h1>Calls for Service</h1>
          </div>
        </div>

        <nav id="buttons" aria-label="Feed actions">
          <span id="map-toggle-slot"></span>
          <span id="search-toggle-slot"></span>
        </nav>
      </header>

      <div class="search-bar" id="search-bar">
        <label class="search-field" for="filter">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.5 3a6.5 6.5 0 1 0 3.98 11.64L19.85 21 21 19.85l-6.36-6.37A6.5 6.5 0 0 0 9.5 3Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/>
          </svg>
          <input type="search" id="filter" placeholder="Search location or call type" autocomplete="off">
        </label>
      </div>
    </div>

    <section class="map-panel" id="map-panel" aria-label="Calls map"></section>

    <section class="status-panel loading" id="status-panel" aria-label="Calls feed status"></section>

    <main id="listing" aria-live="polite"></main>
  </div>

  <script type="module" src="src/app/main.js"></script>

  </body>
  </html>
