
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>SD Sheriff Calls For Service</title>
  <meta name="description" content="Calls for service for the San Diego Sheriff's Department">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32x32.png">
  <style>
    :root {
      color-scheme: dark;
      --primary: #4d9dff;
      --on-primary: #001a3a;
      --primary-container: #0f2c4d;
      --on-primary-container: #bfdcff;
      --secondary: #ff4d4d;
      --on-secondary-container: #ffd4d4;
      --secondary-container: #4a1414;
      --surface: #000000;
      --surface-container: #0a0a0d;
      --surface-container-high: #121218;
      --surface-container-highest: #1a1a22;
      --on-surface: #eaeaf0;
      --on-surface-variant: #9a9aa8;
      --outline: #5a5a68;
      --outline-variant: #26262f;
      --error: #ff6b6b;
      --error-container: #4a1414;
      --shadow: rgba(0, 0, 0, 0.6);
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      --ease-emphasized: cubic-bezier(0.2, 0, 0, 1.2);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--surface);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--on-surface);
      background:
        radial-gradient(circle at 8% -12%, rgba(77, 157, 255, 0.10), transparent 30rem),
        radial-gradient(circle at 96% 0%, rgba(255, 77, 77, 0.07), transparent 28rem),
        var(--surface);
      font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 0.875rem;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a,
    input {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    .app-shell {
      width: min(100%, 1400px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 20px 32px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -20px;
      background: rgba(0, 0, 0, 0.9);
      border-bottom: 1px solid var(--outline-variant);
      backdrop-filter: blur(18px) saturate(135%);
      animation: app-bar-enter 360ms var(--ease-standard) both;
    }

    .top-app-bar {
      display: grid;
      grid-template-columns: minmax(220px, auto) auto;
      grid-template-areas: "brand actions";
      align-items: center;
      gap: 20px;
      min-height: 64px;
      padding: max(8px, env(safe-area-inset-top)) 20px 8px;
    }

    .search-bar {
      display: flex;
      align-items: center;
      height: 0;
      overflow: hidden;
      padding: 0 20px;
      transition: height 220ms var(--ease-emphasized);
    }

    .search-bar.open {
      height: 60px;
    }

    .search-bar .search-field {
      width: 100%;
    }

    .brand {
      grid-area: brand;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--on-primary-container);
      background: linear-gradient(145deg, #1a4a80, var(--primary-container));
      border: 1px solid rgba(77, 157, 255, 0.28);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 20, 45, 0.4);
    }

    .brand-mark svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      display: block;
      margin-bottom: 1px;
      color: var(--on-surface-variant);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    h1 {
      overflow: hidden;
      margin: 0;
      font-size: clamp(1.02rem, 1.6vw, 1.2rem);
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-field {
      position: relative;
      display: flex;
      align-items: center;
      height: 40px;
      color: var(--on-surface-variant);
      background: var(--surface-container-high);
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      transition: background 160ms var(--ease-standard), border-color 160ms var(--ease-standard), box-shadow 160ms var(--ease-standard);
    }

    .search-field:focus-within {
      color: var(--primary);
      background: var(--surface-container-highest);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(77, 157, 255, 0.14);
    }

    .search-field svg {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin-left: 13px;
      fill: currentColor;
      pointer-events: none;
    }

    #filter {
      width: 100%;
      height: 100%;
      min-width: 0;
      padding: 0 16px 0 12px;
      color: var(--on-surface);
      background: transparent;
      border: 0;
      outline: 0;
    }

    #filter::placeholder {
      color: var(--on-surface-variant);
      opacity: 0.84;
    }

    #buttons {
      grid-area: actions;
      display: flex;
      justify-content: flex-end;
    }

    .icon-button {
      position: relative;
      display: grid;
      width: 40px;
      height: 40px;
      padding: 0;
      place-items: center;
      color: var(--on-primary-container);
      background: var(--primary-container);
      border: 1px solid rgba(77, 157, 255, 0.22);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 20, 45, 0.35);
      cursor: pointer;
      overflow: hidden;
      transition: transform 140ms var(--ease-standard), background 140ms var(--ease-standard), box-shadow 140ms var(--ease-standard);
    }

    .icon-button::before {
      position: absolute;
      inset: 0;
      background: currentColor;
      content: "";
      opacity: 0;
      transition: opacity 140ms var(--ease-standard);
    }

    .icon-button:hover {
      box-shadow: 0 9px 24px rgba(0, 34, 70, 0.38);
      transform: translateY(-1px);
    }

    .icon-button:hover::before {
      opacity: 0.08;
    }

    .icon-button:active {
      transform: scale(0.94);
    }

    .icon-button:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .icon-button:disabled {
      cursor: wait;
      opacity: 0.78;
    }

    .icon-button svg {
      position: relative;
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .icon-button:disabled svg {
      animation: spin 720ms linear infinite;
    }

    .status-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      margin: 14px 0 10px;
      padding: 10px 16px;
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      box-shadow: 0 14px 40px var(--shadow);
      animation: surface-enter 380ms 60ms var(--ease-standard) both;
    }

    .feed-summary {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .status-dot {
      position: relative;
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      background: var(--secondary);
      border: 2px solid rgba(255, 77, 77, 0.3);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(255, 77, 77, 0.1);
    }

    .status-panel.loading .status-dot::after {
      position: absolute;
      inset: -6px;
      border: 1px solid var(--secondary);
      border-radius: inherit;
      content: "";
      animation: status-pulse 1.25s var(--ease-standard) infinite;
    }

    .status-panel.error .status-dot {
      background: var(--error);
      border-color: rgba(255, 107, 107, 0.3);
      box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
    }

    .status-label {
      display: block;
      margin-bottom: 1px;
      color: var(--on-surface-variant);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .update-line {
      margin: 0;
      color: var(--on-surface);
      font-size: 0.85rem;
    }

    #update {
      font-weight: 650;
    }

    .status-meta {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    #calls-status,
    #event-count {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      padding: 3px 10px;
      color: var(--on-primary-container);
      background: rgba(15, 44, 77, 0.85);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.015em;
      white-space: nowrap;
    }

    #event-count {
      color: var(--on-surface-variant);
      background: var(--surface-container-highest);
    }

    .status-panel.error #calls-status {
      color: var(--error);
      background: var(--error-container);
    }

    #listing {
      min-height: 220px;
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      box-shadow: 0 18px 48px var(--shadow);
      overflow: hidden;
      animation: surface-enter 420ms 110ms var(--ease-standard) both;
    }

    .loading-state,
    .error-state {
      display: grid;
      min-height: 240px;
      padding: 32px;
      place-items: center;
      color: var(--on-surface-variant);
      text-align: center;
    }

    .loading-content {
      width: min(100%, 360px);
    }

    .loading-content p {
      margin: 0 0 20px;
      font-weight: 550;
    }

    .loading-bar {
      height: 10px;
      margin-top: 10px;
      background: linear-gradient(90deg, var(--surface-container-high) 25%, var(--surface-container-highest) 45%, var(--surface-container-high) 65%);
      background-size: 250% 100%;
      border-radius: 999px;
      animation: shimmer 1.1s linear infinite;
    }

    .loading-bar:nth-child(2) {
      width: 78%;
    }

    .loading-bar:nth-child(3) {
      width: 92%;
    }

    .loading-bar:nth-child(4) {
      width: 64%;
    }

    .error-state strong {
      display: block;
      margin-bottom: 6px;
      color: var(--error);
      font-size: 1.05rem;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    thead {
      background: var(--surface-container-high);
    }

    th,
    td {
      padding: 8px 14px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--on-surface-variant);
      background: var(--surface-container-high);
      border-bottom: 1px solid var(--outline-variant);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    th.Address,
    td.Address {
      width: 42%;
    }

    th.DateTime,
    td.DateTime {
      width: 20%;
    }

    th.EventType,
    td.EventType {
      width: 38%;
    }

    tbody tr:not(.map) {
      cursor: pointer;
      animation: row-enter 280ms var(--ease-standard) both;
      animation-delay: min(calc(var(--row-index, 0) * 16ms), 220ms);
      transition: background 140ms var(--ease-standard), opacity 140ms var(--ease-standard);
    }

    tbody tr:not(.map):hover {
      background: rgba(77, 157, 255, 0.06);
    }

    tbody tr:not(.map):focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -3px;
    }

    td {
      color: var(--on-surface);
      border-bottom: 1px solid var(--outline-variant);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr.open td:first-child {
      box-shadow: inset 3px 0 0 var(--secondary);
    }

    tbody tr:not(.open) {
      opacity: 0.58;
    }

    tbody tr:not(.open):hover {
      opacity: 0.8;
    }

    td.Address::before {
      display: inline-flex;
      margin: 0 7px 3px 0;
      padding: 1px 6px;
      color: var(--on-surface-variant);
      background: var(--surface-container-highest);
      border-radius: 999px;
      content: "Closed";
      font-size: 0.58rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      line-height: 1.5;
      text-transform: uppercase;
      vertical-align: middle;
    }

    tr.open td.Address::before {
      color: var(--on-secondary-container);
      background: var(--secondary-container);
      content: "Open";
    }

    .Address a {
      display: inline;
      color: var(--on-surface);
      font-weight: 600;
      line-height: 1.35;
      text-decoration: none;
    }

    .Address a:hover .address-primary {
      color: var(--primary);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .address-primary,
    .community {
      display: block;
    }

    .community {
      margin-top: 1px;
      color: var(--on-surface-variant);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.025em;
      text-transform: uppercase;
    }

    td.DateTime {
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
      font-size: 0.82rem;
    }

    td.EventType {
      color: var(--on-surface);
      font-weight: 520;
    }

    tr.new td:first-child {
      box-shadow: inset 3px 0 0 var(--primary);
    }

    tr.changed td:first-child {
      box-shadow: inset 3px 0 0 var(--secondary);
    }

    tr.nearby {
      background: rgba(255, 77, 77, 0.12);
    }

    tr.map td {
      padding: 0;
      background: #000000;
      overflow: hidden;
    }

    tr.map .map-slide {
      display: block;
      height: 0;
      overflow: hidden;
      transition: height 260ms var(--ease-emphasized);
    }

    tr.map.open .map-slide {
      height: 320px;
    }

    tr.map iframe {
      display: block;
      width: 100%;
      height: 320px;
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    @keyframes app-bar-enter {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes surface-enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes row-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes status-pulse {
      from { opacity: 0.65; transform: scale(0.55); }
      to { opacity: 0; transform: scale(1.35); }
    }

    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: -100% 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 760px) {
      .app-shell {
        padding: 0 10px 22px;
      }

      .app-header {
        margin: 0 -10px;
      }

      .top-app-bar {
        grid-template-columns: 1fr auto;
        gap: 10px;
        min-height: 56px;
        padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      }

      .search-bar {
        padding: 0 12px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 12px;
      }

      .search-field {
        height: 40px;
        border-radius: 12px;
      }

      .icon-button {
        width: 38px;
        height: 38px;
        border-radius: 12px;
      }

      .status-panel {
        align-items: flex-start;
        margin: 10px 0 8px;
        padding: 10px 12px;
        border-radius: 14px;
      }

      .status-meta {
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
      }

      #calls-status,
      #event-count {
        min-height: 24px;
        padding: 3px 8px;
        font-size: 0.66rem;
      }

      #listing {
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        overflow: visible;
      }

      thead {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        clip: rect(0, 0, 0, 0);
        overflow: hidden;
      }

      table,
      tbody {
        display: block;
      }

      tbody {
        display: grid;
        gap: 7px;
      }

      tbody tr:not(.map) {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 12px;
        padding: 11px 13px;
        background: var(--surface-container);
        border: 1px solid var(--outline-variant);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      tbody tr:not(.map):hover {
        background: var(--surface-container-high);
      }

      tbody tr.open,
      tbody tr.new,
      tbody tr.changed {
        border-left-color: var(--secondary);
      }

      tbody tr:not(.open) {
        opacity: 0.68;
      }

      td,
      th.Address,
      td.Address,
      th.DateTime,
      td.DateTime,
      th.EventType,
      td.EventType {
        width: auto;
      }

      td {
        display: block;
        padding: 0;
        border: 0;
      }

      tbody tr.open td:first-child,
      tr.new td:first-child,
      tr.changed td:first-child {
        box-shadow: none;
      }

      td.Address {
        grid-column: 1 / 2;
        grid-row: 1;
        min-width: 0;
      }

      td.Address::before {
        margin-bottom: 5px;
      }

      td.DateTime {
        grid-column: 2 / 3;
        grid-row: 1;
        align-self: start;
        padding-top: 2px;
        font-size: 0.72rem;
        text-align: right;
        white-space: nowrap;
      }

      td.EventType {
        grid-column: 1 / -1;
        grid-row: 2;
        padding-top: 8px;
        color: var(--primary);
        border-top: 1px solid var(--outline-variant);
        font-size: 0.82rem;
      }

      tr.map {
        display: block;
        margin-top: -7px;
      }

      tr.map td {
        display: block;
        padding: 0;
        background: transparent;
      }

      tr.map .map-slide {
        padding: 0 1px;
      }

      tr.map.open .map-slide {
        height: 250px;
        padding: 6px 1px 0;
      }

      tr.map iframe {
        height: 244px;
        border: 1px solid var(--outline-variant);
        border-radius: 14px;
      }
    }

    @media (max-width: 420px) {
      .status-panel {
        gap: 12px;
      }

      .status-label {
        font-size: 0.66rem;
      }

      .update-line {
        font-size: 0.88rem;
      }

      #calls-status {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
          <div class="loading-bar"></div>
        </div>
      </div>
    </main>
  </div>

    getDistanceInMilesAndFeet(spot) {
    // Convert latitudes and longitudes to radians
      const lat1Radians = toRadians(spot.lat);
      const lng1Radians = toRadians(spot.lng);
      const lat2Radians = toRadians(this.coords.lat);
      const lng2Radians = toRadians(this.coords.lng);

      // Calculate the distance using the Haversine formula
      const earthRadiusInMiles = 3958.8;
      const deltaLat = lat2Radians - lat1Radians;
      const deltaLng = lng2Radians - lng1Radians;
      const a = Math.pow(Math.sin(deltaLat / 2), 2) +
                Math.cos(lat1Radians) * Math.cos(lat2Radians) *
                Math.pow(Math.sin(deltaLng / 2), 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distanceInMiles = earthRadiusInMiles * c;
      const distanceInFeet = distanceInMiles * 5280;

      // Round the distance to the nearest mile and foot
      const distanceInMilesRounded = Math.round(distanceInMiles);
      const distanceInFeetRounded = Math.round(distanceInFeet);

      // Return an object with the distance in miles and feet
      return {
        miles: distanceInMilesRounded,
        feet: distanceInFeetRounded - (distanceInMilesRounded * 5280),
      };
    }

  //a function that pretty prints miles that are a floating number to tenths of a mile and feet
  //so 1.5686 miles becomes 1.5 miles and 362 feet
  //it will return back a string
  function prettyPrintDistance(miles) {
    miles = miles * 10;
    let feet = miles * 528;
    feet = feet % 5280;
    feet = Math.round(feet);
    miles = Math.floor(miles);
    miles = miles / 10;
    return `${miles} miles ${feet} feet`;
  }

  function prettyTime(datestring){
    const normalizedDate = String(datestring).replace(
      /^(\d{2})-(\d{2})-(\d{4})/,
      '$1/$2/$3'
    );
    const diff = new Date(normalizedDate) - new Date();
    const minutes = Math.round(diff / 60000);

    const formatter = new Intl.RelativeTimeFormat('en-US', {
        numeric: 'auto',
    });

    if (Math.abs(minutes) < 60) {
      return formatter.format(minutes, 'minute');
    }

    const hours = Math.round(minutes / 60);
    if (Math.abs(hours) < 24) {
      return formatter.format(hours, 'hour');
    }

    return formatter.format(Math.round(hours / 24), 'day');
  }
  async function fetchJson(url) {
    const response = await fetch(url, {
      cache: 'no-store',
    });
    const responseText = await response.text();
    let data;

    try {
      data = JSON.parse(responseText);
      if (typeof data === 'string') {
        data = JSON.parse(data);
      }
    } catch (error) {
      throw new Error(`Calls service returned invalid JSON (HTTP ${response.status}).`);
    }

    if (!response.ok) {
      const message = data.message || data.error || response.statusText || 'Request failed';
      throw new Error(`${message} (HTTP ${response.status}).`);
    }

    return data;
  }

  class TableFilter {
    constructor(table){
      this.filterInput = document.querySelector("input#filter");
      this.eventCountElement = document.querySelector("#event-count");
      this.setTable(table);
      this.filterInput.addEventListener("change", this.runFilter.bind(this));
      this.filterInput.addEventListener("input", this.runFilter.bind(this));

    }
    setTable(table) {
      this.table = table;
    }
    runFilter() {
      const filter = this.filterInput.value;
      const rows = this.table.querySelectorAll("tbody tr:not(.map)");
      let visibleCount = 0;
      for(const row of rows){
        const matches = row.textContent.toLowerCase().includes(filter.toLowerCase());
        const mapRow = row.nextElementSibling?.classList.contains('map')
          ? row.nextElementSibling
          : null;
        if(matches){
          row.classList.remove("hidden");
          mapRow?.classList.remove('hidden');
          visibleCount += 1;
        } else {
          row.classList.add("hidden");
          mapRow?.classList.add('hidden');
        }
      }
      this.eventCountElement.textContent = filter
        ? `${visibleCount} of ${rows.length} calls`
        : `${rows.length} call${rows.length === 1 ? '' : 's'}`;
    }
  }
